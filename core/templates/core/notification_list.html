<div class="p-4 bg-white">
    <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg">Notifications</h3>
        <button hx-post="{% url 'core:mark_notifications_read' %}" hx-target="#notif-badge" hx-swap="outerHTML" class="text-xs text-blue-500 hover:underline">Mark all as read</button>
    </div>
    <div class="space-y-3 max-h-96 overflow-y-auto">
        {% for notif in notifications %}
        <div class="p-3 rounded-lg {% if not notif.is_read %}bg-blue-50 border-l-4 border-blue-500{% else %}bg-gray-50{% endif %} transition-colors">
            <p class="text-sm font-medium text-gray-800">{{ notif.message }}</p>
            <span class="text-[10px] text-gray-500">{{ notif.created_at|timesince }} ago</span>
        </div>
        {% empty %}
        <div class="text-center py-6 text-gray-400">
            <p>No notifications yet</p>
        </div>
        {% endfor %}
    </div>
</div>
