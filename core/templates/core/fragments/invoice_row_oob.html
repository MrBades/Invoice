<tr class="animate-fade-in" hx-swap-oob="afterbegin:#invoice-list-body">
    <td>
        <a href="{% url 'core:invoice_detail' invoice.pk %}" style="text-decoration: none; color: var(--primary); font-weight: 700;">
            {{ invoice.invoice_number }}
        </a>
    </td>
    <td>{{ invoice.customer.name }} ⚪</td>
    <td>{{ invoice.issue_date }}</td>
    <td>₦{{ invoice.total_amount|floatformat:2 }}</td>
    <td>
        <span class="badge badge-warning">Draft</span>
    </td>
    <td>Pending...</td>
</tr>

<div id="truth-sales-sticky" hx-swap-oob="true">Total Sales: ₦{{ total_sales_sum }}</div>
<div id="truth-debt-sticky" hx-swap-oob="true">Outstanding Debt: ₦{{ total_debt_sum }}</div>
<div id="truth-sales-card" hx-swap-oob="true" class="value truth-sales">₦{{ total_invoiced }}</div>
<div id="truth-debt-card" hx-swap-oob="true" class="value truth-debt">₦{{ total_debt }}</div>
