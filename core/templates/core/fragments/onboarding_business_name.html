<div class="chat-bubble animate-fade-in">
    <h2 class="text-2xl font-extrabold text-primary mb-4">First things first...</h2>
    <p class="text-gray-600 mb-6">What is the name of your amazing business?</p>
    <form hx-post="{% url 'core:onboarding' %}?step=business_name" hx-target="#onboarding-content">
        <input type="text" name="business_name" placeholder="e.g. Bades Electronics" 
               class="w-full p-4 rounded-xl border-2 border-secondary focus:border-primary outline-none mb-4" required autofocus>
        <button type="submit" class="btn btn-primary w-full justify-center">Next Step</button>
    </form>
</div>
